<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="84" viewBox="0 0 1280 84" role="img" aria-label="Section 07: Uplink"><defs><style>@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2')}.orb{font-family:'Orb',Orbitron,'Arial Black',sans-serif}@font-face{font-family:'OrbM';src:url(data:font/woff2;base64,) format('woff2')}.orbm{font-family:'OrbM',Orbitron,Arial,sans-serif}@font-face{font-family:'Grot';src:url(data:font/woff2;base64,) format('woff2')}.grot{font-family:'Grot','Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'Mono',Menlo,Consolas,monospace}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
