<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" role="img" aria-label="End of transmission. Thanks for stopping by."><defs><style>@font-face{font-family:'Orb';src:url(data:font/woff2;base64,) format('woff2')}.orb{font-family:'Orb',Orbitron,'Arial Black',sans-serif}@font-face{font-family:'OrbM';src:url(data:font/woff2;base64,) format('woff2')}.orbm{font-family:'OrbM',Orbitron,Arial,sans-serif}@font-face{font-family:'Grot';src:url(data:font/woff2;base64,) format('woff2')}.grot{font-family:'Grot','Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'Mono';src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:'Mono',Menlo,Consolas,monospace}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.blink{animation:blink 1.1s step-end infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.2s ease-in-out infinite}
@keyframes ffh0{to{transform:translateY(1.7px)}}@keyframes ffh1{to{transform:translateY(5.2px)}}@keyframes ffh2{to{transform:translateY(8.6px)}}@keyframes ffh3{to{transform:translateY(12.0px)}}@keyframes ffh4{to{transform:translateY(15.5px)}}@keyframes ffh5{to{transform:translateY(18.9px)}}@keyframes ffh6{to{transform:translateY(22.3px)}}@keyframes ffh7{to{transform:translateY(25.8px)}}@keyframes ffh8{to{transform:translateY(29.2px)}}</style>
